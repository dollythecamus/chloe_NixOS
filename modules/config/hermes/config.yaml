model:
  default: qwen3.8-flash
  provider: opencode-go
  base_url: https://opencode.ai/zen/go/v1
  api_mode: chat_completions
agent:
  max_turns: 150
terminal:
  backend: local
web:
  backend: firecrawl
  use_gateway: true
browser:
  cloud_provider: local
display:
  tool_progress: all
computer_use:
  backend: cua
proxy:
  enabled: true
# Persistent memory across sessions (was dropped from this file in the v41
# rewrite — DO NOT remove: this is what stops Hermes from "forgetting").
memory:
  memory_enabled: true
  user_profile_enabled: true
# Never auto-reset sessions/memory between runs.
session_reset:
  mode: none
redact_secrets: true
_config_version: 41
platform_toolsets:
  cli:
    - a2a
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - yuanbao
known_plugin_toolsets:
  cli:
    - a2a
    - spotify
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao