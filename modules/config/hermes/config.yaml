model:
  default: openrouter/owl-alpha
agent:
  max_turns: 150
  disabled_toolsets:
    - computer_use
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    - kanban
    - project
    - search
    - spotify
    - tts
    - video
    - video_gen
    - vision
    - x_search
    - yuanbao
terminal:
  backend: local
web:
  backend: searxng
  use_gateway: true
browser:
  cloud_provider: local
  use_gateway: false
compression:
  enabled: true
display:
  tool_progress: all
memory:
  memory_enabled: true
  user_profile_enabled: true
_config_version: 33
session_reset:
  mode: none
platform_toolses:
  cli:
    - browser
    - clarify
    - code_execution
    - context_engine
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - web
  discord:
    - browser
    - clarify
    - code_execution
    - context_engine
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - web
known_plugin_toolsets:
  cli:
    - spotify
  discord:
    - spotify
smart_model_routing:
  enabled: false
redact_secrets: true