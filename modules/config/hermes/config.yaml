model:
  default: deepseek-v4.1-flash
  provider: opencode-go
  base_url: https://opencode.ai/zen/go/v1
agent:
  max_turns: 300
  reasoning_effort: high
terminal:
  backend: local
web:
  # Parallel.ai's anonymous keyless endpoint (no API key, no account) for BOTH
  # search and extract; on throttle the keyless ring fails over to
  # Firecrawl -> Exa -> Keenable. Do NOT set use_gateway: true here — it
  # selects the managed Nous Tool Gateway, which this instance has no
  # subscription for, and every web_search/web_extract call then fails with
  # "the Nous Tool Gateway is not available (not entitled or unreachable)".
  #
  # 2026-09-23: this was `firecrawl` with a `free` tier pin. Firecrawl's
  # keyless cloud endpoint returns HTTP 403 Forbidden for every request
  # (verified against https://api.firecrawl.dev/v2/search and /v2/scrape), and
  # because the config *named* firecrawl the keyless ring pinned the walk to
  # start there; the error is not rate-limit-shaped so the walk stopped
  # immediately and every web_search / web_extract call failed (out-of-band
  # 403 from Firecrawl, not an entitlement problem). Parallel is verified
  # working keyless for both search and extract; `provider_tier.parallel:
  # free` routes it keyless even if an API key is later added to .env.
  backend: parallel
  provider_tier:
    parallel: free
browser:
  cloud_provider: local
  engine: lightpanda
stt:
  enabled: true
  provider: local
  local:
    model: small
tts:
  # Edge TTS (upstream default) is blocked: Microsoft's endpoint rejects the
  # websocket handshake with 403 (verified 2026-10-21), independent of this
  # host. Local Piper is the working path. The CLI and voice are installed by
  # modules/hermes.nix; PYTHONPATH is dropped because the gateway exports the
  # sealed venv's Python 3.14 packages and piper is built for 3.13.
  provider: piper-cli
  providers:
    piper-cli:
      type: command
      format: wav
      command: "/run/current-system/sw/bin/env -u PYTHONPATH /run/current-system/sw/bin/piper -m /etc/hermes/piper/en_US-amy-medium.onnx -i {input_path} -f {output_path}"
display:
  tool_progress: all
computer_use:
  backend: cua
  # Route the driver through niri's native Wayland backend instead of the
  # XWayland-only view (no X11 clients here, so X11 mode sees nothing).
  # Hermes turns this into CUA_DRIVER_RS_ENABLE_WAYLAND=1 in the driver child
  # env (tools/computer_use/cua_backend.py); the same variable is also exported
  # session-wide by modules/cua-driver.nix for manual `cua-driver doctor` runs.
  native_wayland: true
proxy:
  enabled: true
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: holographic
  # Built-in MEMORY.md/USER.md budget. Raised from 2,200/1,375 on 2026-10-21
  # because the store hit 98% and rejected writes. Cost: ~+370 tokens injected
  # per API call. Consolidation still happens before adding; see the tooling
  # repair plan Phase 3.
  memory_char_limit: 3000
  user_char_limit: 1600
plugins:
  hermes-memory-store:
    db_path: $HERMES_HOME/memory_store.db
    auto_extract: true
# Never auto-reset sessions/memory between runs.
session_reset:
  mode: none
redact_secrets: true
_config_version: 50
platforms:
  discord:
    gateway_restart_notification: false
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - video
    - vision
    - web
  # Cron gets everything the CLI gets EXCEPT computer_use: unattended jobs must
  # never grab the mouse/keyboard. Discord keeps the hermes-discord bundle
  # (which includes computer_use), so GUI requests can arrive from chat.
  cron:
    - browser
    - clarify
    - code_execution
    - connections
    - context_engine
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - stt
    - terminal
    - todo
    - tts
    - video
    - vision
    - web
known_plugin_toolsets:
  cli:
    - a2a
    - spotify
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
mcp_servers:
  godot-mcp-toolkit:
    # NPGameDev Godot MCP Toolkit: editor addon + npm stdio-to-WebSocket bridge.
    # The addon is already enabled in magical-collector; point discovery at this project
    # because the Hermes gateway's working directory is not the Godot project root.
    command: "/run/current-system/sw/bin/npx"
    args: ["-y", "@npgamedev/godot-mcp-server"]
    env:
      PATH: "/run/current-system/sw/bin"
      GODOT_MCP_PROJECT_PATH: "/home/chloe/projects/magical-collector"
      GODOT_MCP_CONFIG_VERSION: "1"
    timeout: 120
    connect_timeout: 60

  unity:
    # MCP for Unity (CoplayDev/unity-mcp v10.0.0, UPM git package in
    # ~/projects/UnityXR_3DMuseu). The Unity package spawns its own MCP server
    # over HTTP (uvx mcpforunityserver==10.0.0) at the package's hardcoded
    # default http://127.0.0.1:8080 (Editor/Helpers/HttpEndpointUtility.cs).
    # Reachable only while the Unity Editor has UnityXR_3DMuseu open; when the
    # editor is closed, discovery fails after backoff and retries next restart.
    url: "http://127.0.0.1:8080/mcp"
    timeout: 180        # scene/profiling ops can be slow
    connect_timeout: 60

# Runtime-added on the live config 2026-10-20 and synced back so activation
# cannot drop it.
gateway:
  multiplex_profiles: true
