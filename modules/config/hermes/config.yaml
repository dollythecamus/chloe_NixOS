model:
  default: deepseek-v4.1-flash
  provider: opencode-go
  base_url: https://opencode.ai/zen/go/v1
  api_mode: chat_completions
agent:
  max_turns: 150
terminal:
  backend: local
web:
  # Keyless free tier: Firecrawl's anonymous public cloud endpoint (no API key,
  # no account) for BOTH search and extract; on throttle the keyless ring fails
  # over to Exa -> Parallel -> Keenable. Do NOT set use_gateway: true here — it
  # selects the managed Nous Tool Gateway, which this instance has no
  # subscription for, and every web_search/web_extract call then fails with
  # "the Nous Tool Gateway is not available (not entitled or unreachable)".
  backend: firecrawl
  provider_tier:
    firecrawl: free
browser:
  cloud_provider: local
display:
  tool_progress: all
computer_use:
  backend: cua
  # Route the driver through niri's native Wayland backend instead of the
  # XWayland-only view (no X11 clients here, so X11 mode sees nothing).
  # Hermes turns this into CUA_DRIVER_RS_ENABLE_WAYLAND=1 in the driver child
  # env (tools/computer_use/cua_backend.py); the same variable is also exported
  # session-wide by modules/cua-driver.nix for manual `cua-driver doctor` runs.
  native_wayland: true
proxy:
  enabled: true
memory:
  memory_enabled: true
  user_profile_enabled: true
# Never auto-reset sessions/memory between runs.
session_reset:
  mode: none
redact_secrets: true
_config_version: 41
platforms:
  discord:
    gateway_restart_notification: false
platform_toolsets:
  cli:
    - a2a
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - yuanbao
known_plugin_toolsets:
  cli:
    - a2a
    - spotify
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
