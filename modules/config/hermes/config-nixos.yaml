model:
  default: gpt-6-luna
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
agent:
  max_turns: 150
  reasoning_effort: high
terminal:
  backend: local
web:
  backend: firecrawl
  provider_tier:
    firecrawl: free
browser:
  cloud_provider: local
display:
  tool_progress: all
computer_use:
  backend: cua
  native_wayland: true
proxy:
  enabled: true
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: holographic
plugins:
  hermes-memory-store:
    db_path: $HERMES_HOME/memory_store.db
    auto_extract: true
session_reset:
  mode: none
redact_secrets: true
_config_version: 45
platform_toolsets:
  cli:
    - a2a
    - browser
    - clarify
    - code_execution
    - computer_use
