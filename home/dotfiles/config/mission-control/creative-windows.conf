# Creative applications may expose dialogs/dockers as ordinary X11 windows.
# No blanket application-wide floating, fixed sizes, forced focus or placement:
# the main editor stays tiled, and the client's transient/position hints survive.
# Native Wayland child toplevels are floated by Sway when a parent is supplied.

for_window [class="(?i)^(Unity|krita|lmms|Godot(_Editor|_Engine|_ProjectManager)?)$" window_type="dialog"] floating enable
for_window [class="(?i)^(Unity|krita|lmms|Godot(_Editor|_Engine|_ProjectManager)?)$" window_type="utility"] floating enable
for_window [class="(?i)^(Unity|krita|lmms|Godot(_Editor|_Engine|_ProjectManager)?)$" window_type="toolbar"] floating enable
for_window [class="(?i)^(Unity|krita|lmms|Godot(_Editor|_Engine|_ProjectManager)?)$" window_role="(?i)^(pop-up|popup|bubble|dialog|toolbox|tool_options)$"] floating enable

# Unity's managed dropdown/selector windows often advertise window_type=normal.
# Class-scoping prevents a Color/Console window from another app being captured.
for_window [class="(?i)^Unity$" title="^UnityEditor[.](AddComponent[.]AddComponentWindow|AnnotationWindow|PopupWindow|Snap|IMGUI[.]Controls[.]AdvancedDropdownWindow|Searcher[.]SearcherWindow|Rendering[.]FilterWindow|LayerVisibilityWindow)$"] floating enable
for_window [class="(?i)^Unity$" title="^(Unity[.]VisualScripting[.]FuzzyWindow|UnityEngine[.]InputSystem[.]Editor[.]AdvancedDropdownWindow)$"] floating enable
for_window [class="(?i)^Unity$" title="^(Color|Gradient Editor|Select (Material|Shader|Texture|GameObject|Object))$"] floating enable
# Detached built-in panels, not titles containing the project/editor suffix.
for_window [class="(?i)^Unity$" title="^(Scene|Game|Inspector|Hierarchy|Project|Console|Animation|Animator|Profiler|Lighting|Package Manager|Project Settings|Preferences)$"] floating enable
